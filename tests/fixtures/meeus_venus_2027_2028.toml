# Twin of meeus_venus_2027_2028.json.
#
# Source: three consecutive Venus rows of Meeus, Astronomical Tables, Table III
# (Occultations chapter), transcribed BY HAND by the project owner on 2026-10-27
# from their own copy of the book. The page numbers were not recorded.
#
# Two corrections were applied to the transcription, both forced by the
# ephemeris and both written down here rather than silently:
#
# 1. 2027 Aug 2: Y1 and Y2 were transcribed as +0.201010 and +0.000137, but the
#    row's Y0 is -0.463605 and the ephemeris has Y increasing negatively
#    (Y1 = -0.199561, Y2 = -0.000140). The signs are flipped here. With the
#    plus signs the solver reports the body as occulted from Hong Kong at
#    Delta = +0.651 (a false event); with the minus signs it reports a miss at
#    2.83 Moon radii, which is what the ephemeris says.
# 2. 2028 Mar 30: H0 and H1 were transcribed as 2.28713 and 210.54873. The
#    first is identical to the 2027 Nov 30 row's H0 (a copy), and the second is
#    210.548 in the H0 column's place. H0 = 210.54873 and H1 = 15.00145 are
#    used, the ephemeris's values at To = 5h. H1 is therefore the one number in
#    this fixture that is derived rather than transcribed.
#
# To is not in the transcription. It was recovered by fitting the transcribed
# D0/H0/X0/Y0 against the ephemeris and lands on an integer hour (5h, 14h, 5h).
#
# The observer is Hong Kong (the project's own site), not the site the printed
# elements were prepared for. All three events MISS the Moon from Hong Kong.
#
# The 'expected' block is DERIVED from this repository's own solver and is a
# regression lock on current behaviour, not an independent oracle.

[metadata]
source = "Transcribed by the user from their own copy of Meeus, Astronomical Tables (Occultations chapter)"
example = "Occultations of Venus, 2027 Aug 2 to 2028 Mar 30"
printed_pages = "not recorded"
pdf_pages = "not recorded"
body = "Venus"
event_keys_are = "universal-time dates (the calendar date of To - Delta T in UT)"
note = "Three consecutive Venus rows of Table III, transcribed by hand by the project owner on 2026-10-27 from their own copy of the book (page numbers not recorded). Two corrections were forced by the ephemeris and are documented in the header of the TOML twin: the 2027-08-02 Y1/Y2 signs were flipped, and the 2028-03-30 H0/H1 had been transcribed into each other's places (H0 was a copy of the 2027-11-30 row, and H1 carried 210.548). To is not in the transcription; it was recovered by fitting D0/H0/X0/Y0 against the ephemeris and lands on an integer hour (5h, 14h, 5h). The observer is Hong Kong, not the site the printed elements were prepared for, so these rows test the plumbing and the custom-vs-ephemeris agreement, not a Hong Kong prediction. All three events miss the Moon from Hong Kong. The 'expected' block is DERIVED from this repository's own solver (a regression lock); the independent check is test_skyfield_agreement.py."

