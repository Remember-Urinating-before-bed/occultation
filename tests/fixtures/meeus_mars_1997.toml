# Regression fixture for Meeus Example 3 (Mars, 1997 November 12, Uccle).
#
# Provenance: Jean Meeus, *Astronomical Tables*, Occultations chapter,
# printed pp. 224-226 (PDF pp. 6-8). The elements come from Table III and are
# restated in the worked example. Meeus prints the longitude west-positive
# (2.3372 degrees west); the project convention is east-positive, hence the
# sign flip. Expected values are the printed results, so the paired test
# tolerances match the number of digits the book shows.
#
# This is the planet case: D1 = -0.00057 deg/h and F = 21.25 make the Moon's
# shadow a cone of radius L = k - zeta F / 1e6 instead of the star's cylinder.

[metadata]
source = "Jean Meeus, Astronomical Tables, Occultations"
example = "Example 3 - Occultation of Mars, 1997 November 12"
printed_pages = "224-226"
pdf_pages = "6-8"
[observer]
# Project convention: east positive. Meeus prints 2.3372 degrees west.
longitude_deg_east = -2.3372
latitude_deg = 48.8364
elevation_m = 67.0

[event]
reference_hour_td = 4.0
delta_t_seconds = 72.0

[elements]
star_declination_deg = 24.99235
greenwich_hour_angle_at_reference_deg = 62.22691
greenwich_hour_angle_rate_deg_per_hour = 15.06158
declination_rate_deg_per_hour = -0.00057
aberration_term = 21.25
moon_shadow_radius_earth_radii = 0.273828

[elements.moon_shadow_x]
at_reference = -0.248914
linear_rate_per_hour = 0.568162
quadratic_term_per_hour_squared = -0.000001

[elements.moon_shadow_y]
at_reference = 0.553450
linear_rate_per_hour = 0.101246
quadratic_term_per_hour_squared = 0.000062

[expected]
rho_sin_geocentric_latitude = 0.749224
rho_cos_geocentric_latitude = 0.659470
hours_after_reference = 1.585130
separation_in_moon_radii = -0.244054
position_angle_deg = 177.01
altitude_deg = 22.7
is_occultation = true
is_visible = true

[expected.immersion]
hours_after_reference = -3.868491
position_angle_deg = 84.48
altitude_deg = 66.14
is_visible = true

[expected.emersion]
hours_after_reference = 8.818967
position_angle_deg = 264.18
altitude_deg = -15.35
is_visible = false
