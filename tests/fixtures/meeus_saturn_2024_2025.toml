# Scaffold fixture for a Saturn planet case keyed to NAOJ, 2024-2025.
#
# STATUS: SCAFFOLD. Every number under [events.*.elements] and
# [events.*.expected] is a PLACEHOLDER. Replace the elements, regenerate the
# expected block, then set metadata.scaffold = false. The reference test in
# tests/reference_cases/test_meeus_saturn.py skips itself while scaffold = true.
#
# WHERE THE MEEUS TABLE III COLUMNS GO (Occultations chapter):
#   To  -> reference_hour_td                          (integer hour, TD)
#   Do  -> star_declination_deg                       (degrees)
#   DI  -> declination_rate_deg_per_hour              (degrees/hour)
#   Ho  -> greenwich_hour_angle_at_reference_deg      (degrees)
#   HI  -> greenwich_hour_angle_rate_deg_per_hour     (degrees/hour)
#   Xo  -> moon_shadow_x.at_reference                 (Earth equatorial radii)
#   XI  -> moon_shadow_x.linear_rate_per_hour
#   X2  -> moon_shadow_x.quadratic_term_per_hour_squared
#   Yo  -> moon_shadow_y.at_reference
#   YI  -> moon_shadow_y.linear_rate_per_hour
#   Y2  -> moon_shadow_y.quadratic_term_per_hour_squared
#   k   -> moon_shadow_radius_earth_radii
#   F   -> aberration_term
#
# Site: Tokyo, a NAOJ "Major City" (NAOJ prints Lat 35.6581, Lon 139.7414,
# Hgt 0.0 m, Delta T = 69 s). The NAOJ snapshot the cross-check reads is
# data/validation/naoj/naoj_saturn_2024_2025.json, saved for Tokyo.
#
# NOTE ON DATES: the four event keys below (2024-11-11, 2024-12-08, 2025-01-04,
# 2025-02-01) are the dates NAOJ prints, and NAOJ dates are JCST (UT+9). Key the
# fixture by whatever date your element source prints, but keep the key and the
# matching entry in data/validation/naoj/naoj_saturn_2024_2025.json identical,
# or the cross-check will not find the event.

[metadata]
source = "Jean Meeus, Astronomical Tables, Occultations"
example = "Table III - Occultations of Saturn, 2024 November 11 to 2025 February 01"
printed_pages = "310-346"
pdf_pages = "92-128"
scaffold = false
note = "Four consecutive Saturn events transcribed from Table III of the Occultations chapter. Every element (To, Do, D1, Ho, H1, Xo/X1/X2, Yo/Y1/Y2, k, F) was read off the scan by eye; OCR text is never a source of truth. The observer is Tokyo, a NAOJ Major City (NAOJ prints Lat 35.6581, Lon 139.7414, Hgt 0.0 m, Delta T = 69 s). Event keys are NAOJ's own JCST dates. Unlike Examples 3 and 5 these rows carry NO printed results, so the 'expected' block is DERIVED from this repository's own solver and is a regression lock on current behaviour, not an independent oracle. The independent check is the saved NAOJ snapshot data/validation/naoj/naoj_saturn_2024_2025.json, read by scripts/verify_reference_data.py --dataset saturn, and the Skyfield ephemeris comparison in tests/reference_cases/test_skyfield_agreement.py."
date_scale = "JCST (UT+9), as NAOJ prints them"
body = "Saturn"
event_keys_are = "NAOJ's own JCST dates (UT+9), which differ from the UT calendar date"

[metadata.tolerances]
hours_after_reference = 1e-06
separation_in_moon_radii = 1e-06
position_angle_deg = 0.01
altitude_deg = 0.01

[observer]
longitude_deg_east = 139.7414
latitude_deg = 35.6581
elevation_m = 0.0

