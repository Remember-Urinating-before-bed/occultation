# Twin of meeus_mars_2031_2032.json.
#
# Source: three consecutive Mars rows of Meeus, Astronomical Tables, Table III
# (Occultations chapter), transcribed BY HAND by the project owner on 2026-10-27
# from their own copy of the book. The page numbers were not recorded.
#
# Two things about this transcription are not like the earlier fixtures:
#
# 1. To is not in the transcription. It was recovered by fitting the
#    transcribed D0/H0/X0/Y0 against the JPL ephemeris, and lands on an integer
#    hour for all three rows (7h, 3h, 2h), which is what Table III's To is.
# 2. It was transcribed from a different edition of the book than the Saturn
#    and Jupiter rows, and its declinations differ from the ephemeris by
#    0.001-0.003 deg (4-11 arcsec) where the older rows agree to 0.0001 deg.
#    That is recorded rather than corrected: the numbers are the source, and the
#    Skyfield comparison states the size of the disagreement it implies.
#
# The observer is Hong Kong (the project's own site), not the site the printed
# elements were prepared for, so these rows exercise the plumbing and the
# custom-vs-ephemeris agreement, not a Hong Kong prediction. All three events
# MISS the Moon from Hong Kong; whichever place they do occult, it is not here.
#
# The 'expected' block is DERIVED from this repository's own solver and is a
# regression lock on current behaviour, not an independent oracle -- the same
# status as the Jupiter and Saturn rows. The independent check is
# tests/reference_cases/test_skyfield_agreement.py.

