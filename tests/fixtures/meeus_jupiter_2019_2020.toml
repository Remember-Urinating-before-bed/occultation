# Twin of meeus_jupiter_2019_2020.json. A transcription slip in either file must
# fail tests/unit/test_elements_file.py::test_the_jupiter_fixture_twins_agree.
#
# Source: Jean Meeus, Astronomical Tables, Occultations, Table III, printed
# pp. 224-226 (PDF pp. 6-8). The elements were transcribed by eye from the scan;
# OCR text is never a source of truth. The observer is Uccle (the site of Meeus
# Example 3) and Delta T = 69 s.
#
# The 'expected' blocks are DERIVED from this repository's own solver, not read
# from the book: these rows carry no printed results, so they are a regression
# lock on current behaviour, not an independent oracle. Event 1 (2019-11-28) is a
# genuine occultation at Uccle; events 2-4 miss the Moon.

[metadata]
source = "Jean Meeus, Astronomical Tables, Occultations"
example = "Table III - Occultations of Jupiter, 2019 November 28 to 2020 February 19"
printed_pages = "224-226"
pdf_pages = "6-8"
note = "Four consecutive Jupiter events transcribed from Table III of the Occultations chapter. The elements (T0, D0, D1, H0, H1, X0/X1/X2, Y0/Y1/Y2, k, F) were read off the scan by eye; OCR text is never a source of truth. The observer is Uccle (the site of Meeus Example 3) and Delta T = 69 s. Unlike Examples 3 and 5 these rows carry NO printed results, so the 'expected' block is DERIVED from this repository's own solver, not read from the book: it is a regression lock on current behaviour, not an independent oracle. Event 1 (2019-11-28) is a genuine occultation at Uccle; events 2-4 miss the Moon, so they report is_occultation = false and have no contacts."

