name: CI

on: 
  push:
    branches:
      - main
      - develop
    pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python
        run: uv python Install
      
      - name: Install project
        run: uv sync --locked --dev

      - name: Show Python version
        run: uv run python --version

      - name: Check linting
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest --cov=occultation --cov-report=term-missing