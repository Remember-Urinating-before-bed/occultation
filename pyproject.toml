[project]
name = "occultation"
version = "0.1.0"
description = "A playground astronomical occulation program for HK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "skyfield>=1.55",
]

[project.scripts]
occultation = "occultation:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
